<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SPP Assistant settings</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #17202a; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #cfd6de; border-radius: 8px; font: inherit; }
    button { margin-top: 12px; background: #0b6e4f; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
    .hint { color: #5d6b7a; font-size: 13px; } .msg { margin-top: 10px; font-size: 13px; }
    code { background: #f0f2f5; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>SPP Assistant settings</h1>
  <label for="backend">Assistant server URL</label>
  <input id="backend" type="url" placeholder="https://spp-assistant.topstepllc.com">
  <p class="hint" id="managedHint" hidden>This value is set by your IT policy.</p>
  <button id="save">Save &amp; test</button>
  <div class="msg" id="msg"></div>
  <p class="hint">Extension ID (give this to whoever runs the server for <code>ALLOWED_ORIGINS</code>): <code id="extId"></code></p>
  <script src="options.js"></script>
</body>
</html>
